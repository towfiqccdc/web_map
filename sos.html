<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SOS Emergency</title>

<link rel="stylesheet" href="css/style.css">

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f5f6f8;
        color: #1f2937;
    }

    .sos-page {
        max-width: 650px;
        margin: 40px auto;
        padding: 20px;
    }

    .sos-card {
        background: #ffffff;
        border-radius: 18px;
        padding: 30px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    .sos-header {
        text-align: center;
        margin-bottom: 28px;
    }

    .sos-icon {
        width: 70px;
        height: 70px;
        margin: 0 auto 15px;
        border-radius: 50%;
        background: #dc2626;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 34px;
    }

    .sos-header h1 {
        margin: 0 0 8px;
        font-size: 28px;
    }

    .sos-header p {
        margin: 0;
        color: #6b7280;
        font-size: 14px;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
    }

    .required {
        color: #dc2626;
    }

    .form-group input,
    .form-group textarea {
        width: 100%;
        box-sizing: border-box;
        padding: 13px 14px;
        border: 1px solid #d1d5db;
        border-radius: 10px;
        font-size: 15px;
        outline: none;
        transition: border-color 0.2s;
    }

    .form-group input:focus,
    .form-group textarea:focus {
        border-color: #dc2626;
    }

    .form-group textarea {
        min-height: 110px;
        resize: vertical;
    }

    .location-box {
        background: #f9fafb;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        padding: 15px;
        margin-bottom: 22px;
    }

    .location-title {
        font-weight: 600;
        margin-bottom: 8px;
    }

    #locationStatus {
        font-size: 14px;
        color: #6b7280;
    }

    #locationMap {
        display: none;
        margin-top: 8px;
        color: #2563eb;
        text-decoration: none;
        word-break: break-all;
    }

    .send-button {
        width: 100%;
        margin-top: 25px;
        padding: 15px;
        border: none;
        border-radius: 12px;
        background: #dc2626;
        color: white;
        font-size: 17px;
        font-weight: 700;
        cursor: pointer;
    }

    .send-button:hover {
        background: #b91c1c;
    }

    .send-button:disabled {
        background: #9ca3af;
        cursor: not-allowed;
    }

    .back-button {
        display: block;
        text-align: center;
        margin-top: 18px;
        color: #4b5563;
        text-decoration: none;
        font-size: 14px;
    }

    .status-message {
        margin-top: 15px;
        padding: 12px;
        border-radius: 10px;
        display: none;
        font-size: 14px;
    }

    .status-success {
        display: block;
        background: #dcfce7;
        color: #166534;
    }

    .status-error {
        display: block;
        background: #fee2e2;
        color: #991b1b;
    }

    @media (max-width: 700px) {
        .sos-page {
            margin: 15px auto;
            padding: 12px;
        }

        .sos-card {
            padding: 22px;
        }
    }
</style>

</head>

<body>

<div class="sos-page">

<div class="sos-card">

    <div class="sos-header">

        <div class="sos-icon">
            🆘
        </div>

        <h1>Emergency SOS</h1>

        <p>
            Send your emergency message with your current location.
        </p>

    </div>


    <!-- NAME -->

    <div class="form-group">

        <label for="name">
            Your Name <span class="required">*</span>
        </label>

        <input
            type="text"
            id="name"
            placeholder="Enter your name"
            maxlength="100"
            autocomplete="name"
        >

    </div>


    <!-- MESSAGE -->

    <div class="form-group">

        <label for="message">
            Short Message
        </label>

        <textarea
            id="message"
            placeholder="Describe your emergency (optional)"
            maxlength="500"
        ></textarea>

    </div>


    <!-- LOCATION -->

    <div class="location-box">

        <div class="location-title">
            📍 Current Location
        </div>

        <div id="locationStatus">
            Getting your current location...
        </div>

        <a
            id="locationMap"
            href="#"
            target="_blank"
            rel="noopener noreferrer"
        >
            Open location in Google Maps
        </a>

    </div>


    <!-- STATUS -->

    <div
        id="statusMessage"
        class="status-message"
    ></div>


    <!-- SEND -->

    <button
        id="sendSOS"
        class="send-button"
        type="button"
        disabled
    >
        🆘 SEND SOS
    </button>


    <a
        href="index.html"
        class="back-button"
    >
        ← Back to Emergency Map
    </a>

</div>

</div>

<script src="js/sos.js"></script>

</body>
</html>
