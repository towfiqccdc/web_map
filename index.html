<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Emergency Route Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="css/style.css?v=20261127a">
</head>
<body>
<div id="map"></div>
<header class="topbar"><div class="brand"><span class="logo" aria-hidden="true">🛡️</span><span class="brand-text"><b>Emergency Route Map</b><small>Live location + project route safety</small></span></div><div class="top-actions"><button id="adminBtn" class="ghost" type="button" title="Add or approve risk areas">🔒 Admin</button><a id="sosBtn" class="danger" href="sos.html">🆘 SOS</a></div></header>
<section class="route-panel panel">
<button id="rpToggle" class="rp-toggle" type="button" aria-expanded="true">🛣️ Plan a safe journey <span>▾</span></button>
<div class="rp-body">
<div class="mode-tabs"><button class="active" data-mode="journey">Safe journey</button><button data-mode="project">Project route</button></div>
<div id="modeJourney">
<label for="fromInput">From</label>
<div class="input-row"><input id="fromInput" type="text" placeholder="e.g. Narsingdi" autocomplete="off"><button id="useMyLoc" class="round" title="Use my location" type="button">⌖</button></div>
<label for="toInput">To</label>
<div class="input-row"><input id="toInput" type="text" placeholder="e.g. Dhaka Cantonment" autocomplete="off"></div>
<button id="planBtn" class="primary" type="button">Check route safety</button>
<div id="journeyStatus" class="journey-status"></div>
<div id="journeyResults"></div>
</div>
<div id="modeProject" class="hidden">
<label>Project route</label><select id="routeSelect"></select><button id="showRouteBtn" class="primary">Show Route</button>
</div>
</div>
</section>
<section id="nearby" class="nearby panel">
<div class="nb-head" id="nbHead">
<div class="nb-title"><b>Nearby help</b><small id="locationStatus">Finding your location…</small></div>
<a class="call999" href="tel:999" title="Call the national emergency number">📞 Call 999</a>
<button id="nbToggle" class="round" type="button" aria-expanded="false" aria-label="Show nearby services">▲</button>
</div>
<div id="nbLocate" class="nb-locate hidden">
<p>Turn on your location to see the closest hospital, police and fire station.</p>
<button id="locateBtn" class="primary" type="button">📍 Use my location</button>
<button id="pickLocBtn" class="small" type="button">Or tap the map to set where you are</button>
</div>
<div id="nbQuick" class="nb-quick">
<button type="button" data-type="hospital"><span class="q-ico">🏥</span><span class="q-name">Hospital</span><span class="q-dist">–</span></button>
<button type="button" data-type="police"><span class="q-ico">🚔</span><span class="q-name">Police</span><span class="q-dist">–</span></button>
<button type="button" data-type="fire"><span class="q-ico">🚒</span><span class="q-name">Fire</span><span class="q-dist">–</span></button>
<button type="button" data-type="fuel"><span class="q-ico">⛽</span><span class="q-name">Fuel</span><span class="q-dist">–</span></button>
</div>
<div id="nbList" class="nb-list hidden">
<div id="serviceList"></div>
<div class="nb-foot"><button id="nbMore" class="small" type="button">Show more</button><button id="nbRefresh" class="small" type="button">↻ Update my location</button></div>
<p class="nb-note">Times are rough estimates for a car. Always follow the road conditions.</p>
</div>
</section>
<div id="trafficLegend" class="traffic-legend hidden"><b>Traffic</b><i class="g"></i>Free <i class="y"></i>Slow <i class="r"></i>Jam</div>
<div class="map-tools"><button id="layersBtn">Layers</button><button id="basemapBtn">Street map</button><button id="trafficBtn" type="button">Traffic</button><button id="riskBtn">Risk</button></div>
<section id="layersPanel" class="layers panel hidden"><div class="heading"><b>Map layers</b><button id="closeLayersBtn" class="round">×</button></div><label><input type="checkbox" data-layer="hospital" checked> Hospitals</label><label><input type="checkbox" data-layer="police" checked> Police stations</label><label><input type="checkbox" data-layer="fire" checked> Fire stations</label><label><input type="checkbox" data-layer="fuel" checked> Fuel stations</label><label><input type="checkbox" data-layer="accident" checked> Accident blackspots</label><label><input type="checkbox" data-layer="crime" checked> Crime-prone areas</label><label><input type="checkbox" data-layer="military" checked> Military areas</label><label><input type="checkbox" data-layer="live" checked> Reported risk areas (live)</label></section>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script><script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script><script src="js/data.js?v=20261127a"></script><script src="js/config.js?v=20261127a"></script><script src="js/routesafety.js?v=20261127a"></script><script src="js/riskstore.js?v=20261127a"></script><script src="js/app.js?v=20261127a"></script><script src="js/planner.js?v=20261127a"></script><script src="js/services.js?v=20261127a"></script><script src="js/nearby.js?v=20261127a"></script><script src="js/traffic.js?v=20261127a"></script><script src="js/risk-editor.js?v=20261127a"></script>
</body></html>
