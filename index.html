<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Emergency Route Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="map"></div>
<header class="topbar"><div><b>Emergency Route Map</b><small>Live location + project route safety</small></div><a id="sosBtn" class="danger" href="sos.html">🆘 SOS</a></header>
<section class="route-panel panel"><label>Project route</label><select id="routeSelect"></select><button id="showRouteBtn" class="primary">Show Route</button></section>
<section class="nearby panel"><div class="heading"><div><h2>Nearby emergency services</h2><small id="locationStatus">Finding your location…</small></div><button id="locateBtn" class="round">⌖</button></div><div class="tabs" id="tabs"><button class="active" data-type="all">All</button><button data-type="hospital">Hospital</button><button data-type="police">Police</button><button data-type="fire">Fire</button><button data-type="fuel">Fuel</button></div><div id="serviceList"></div></section>
<div class="map-tools"><button id="layersBtn">Layers</button><button id="satelliteBtn">Satellite</button><button id="riskBtn">Risk</button></div>
<section id="layersPanel" class="layers panel hidden"><div class="heading"><b>Map layers</b><button id="closeLayersBtn" class="round">×</button></div><label><input type="checkbox" data-layer="hospital" checked> Hospitals</label><label><input type="checkbox" data-layer="police" checked> Police stations</label><label><input type="checkbox" data-layer="fire" checked> Fire stations</label><label><input type="checkbox" data-layer="fuel" checked> Fuel stations</label><label><input type="checkbox" data-layer="accident" checked> Accident blackspots</label><label><input type="checkbox" data-layer="crime" checked> Crime-prone areas</label><label><input type="checkbox" data-layer="military" checked> Military areas</label></section>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script><script src="js/data.js"></script><script src="js/app.js"></script>
</body></html>
