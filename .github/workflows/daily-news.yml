name: Daily news check

# Runs every hour (at minute 10), and whenever you press
# "Run workflow" on the Actions tab. It only ADDS pending items; nothing goes live
# until you approve it on the map (Admin button).
on:
  schedule:
    - cron: "10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Search the news and add pending risk areas
        run: python3 news/fetch_news.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MYMEMORY_EMAIL: ${{ secrets.MYMEMORY_EMAIL }}   # optional: raises the free translation limit
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # optional: free AI second reader for uncertain places
